name: CI (PR-gate)

# PR-gate runs Static + Unit ONLY. No MTCore subprocess, no live exchange.
# Smoke + LiveTrade + BenchAll are routed to
# .github/workflows/testing-environment.yml (manual / scheduled, separate
# self-hosted runner).
#
# The same pinned vendor restore runs on Linux x64, macOS arm64 and Windows x64.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3 (vendor restore and offline archive tests)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore
        run: dotnet restore MTTextClient.sln

      - name: Build (Release)
        run: dotnet build MTTextClient.sln -c Release --no-restore

      - name: Verify build with offline vendor cache
        run: dotnet build MTTextClient.sln -c Release --no-restore -p:VendorOffline=true

      - name: Run Static + Unit tests
        run: >
          dotnet test MTTextClient.sln
          -c Release --no-build
          --filter "Category=Static|Category=Unit"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: ignore
